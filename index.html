<body>

    <!-- Blogger Feed Section -->
    <section class="card animate-fade-in blogger-section"
        style="animation-delay: 0.3s; padding-bottom: 2rem; width: 100%; max-width: 480px;">
        <h2 class="blog-title"><i class="fa-solid fa-pen-nib"></i> Latest from the Oven</h2>

        <div id="blogger-feed" class="blogger-feed">
            <div class="loading-posts">Loading latest updates...</div>
        </div>

        <a href="https://overproofedbakery.blogspot.com/" target="_blank" rel="noopener noreferrer"
            class="follow-btn">Visit Full Blog</a>
    </section>

    <script>
        // Handle the Blogger JSONP response
        function handleBloggerFeed(data) {
            const container = document.getElementById('blogger-feed');
            const entries = data.feed.entry || [];

            container.innerHTML = '';

            if (entries.length === 0) {
                container.innerHTML = '<p class="ig-caption">No posts yet.</p>';
                return;
            }

            entries.slice(0, 3).forEach(post => {
                // Handle empty titles
                const title = post.title.$t.trim() ? post.title.$t : 'Sourdough Update';
                const publishedDate = new Date(post.published.$t).toLocaleDateString('en-US', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });

                let postUrl = '#';
                for (let i = 0; i < post.link.length; i++) {
                    if (post.link[i].rel === 'alternate') {
                        postUrl = post.link[i].href;
                        break;
                    }
                }

                // Parse content
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = post.content.$t;
                const textContent = tempDiv.textContent || tempDiv.innerText || '';
                const excerpt = textContent.length > 100 ? textContent.substring(0, 100) + '...' : textContent;

                // Grab first image
                const imgMatch = tempDiv.querySelector('img');
                const imgHtml = imgMatch ? `<div class="blog-img-wrapper"><img src="${imgMatch.src}" alt="${title}"></div>` : '';

                const articleHtml = `
                    <article class="blog-post">
                        <span class="blog-date">${publishedDate}</span>
                        <h3 class="blog-post-title"><a href="${postUrl}" target="_blank">${title}</a></h3>
                        ${imgHtml}
                        <p class="blog-excerpt">${excerpt}</p>
                        <a href="${postUrl}" target="_blank" class="read-more">Read post <i class="fa-solid fa-arrow-right"></i></a>
                    </article>
                `;

                container.insertAdjacentHTML('beforeend', articleHtml);
            });
        }

        // Load the feed via JSONP to bypass CORS (useful for local files)
        const script = document.createElement('script');
        script.src = 'https://overproofedbakery.blogspot.com/feeds/posts/default?alt=json-in-script&callback=handleBloggerFeed';
        document.body.appendChild(script);

        // Fallback error handling
        setTimeout(() => {
            const container = document.getElementById('blogger-feed');
            if (container && container.innerHTML.includes('Loading latest updates...')) {
                container.innerHTML = '<p class="ig-caption">Could not load posts. Please visit our blog directly.</p>';
            }
        }, 5000);
    </script>
